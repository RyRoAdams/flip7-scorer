<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Flip 7 Scorer</title>

    <!-- PWA manifest -->
    <link
        rel="manifest"
        href="manifest.json"
    >

    <!-- Browser / Android theme -->
    <meta
        name="theme-color"
        content="#5b5ce2"
    >

    <!-- Android / mobile web app -->
    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <!-- iPhone / iPad support -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Flip 7"
    >

    <!-- App design -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- JavaScript builds the app inside this container -->
    <div id="app"></div>


    <!-- Game logic -->
    <script src="app.js"></script>


    <!-- PWA service worker -->
    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker.register(
                        "service-worker.js"
                    );

                }
            );

        }

    </script>

</body>

</html>
